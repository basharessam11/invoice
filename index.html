<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشار عصام | نظام الفواتير الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;700&display=swap');
        body { font-family: 'Alexandria', sans-serif; color: #1e293b; background-color: #f8fafc; font-size: 12px; }
        .invoice-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .editable { transition: 0.2s; border-radius: 3px; padding: 2px 4px; border-bottom: 1px dashed transparent; }
        .editable:hover { background-color: #f1f5f9; border-bottom-color: #cbd5e1; cursor: text; }
        .editable:focus { outline: none; background-color: #fff; border-bottom-color: #10b981; }
        
        /* منطقة اللوجو */
        .logo-container { 
            width: 120px; height: 120px; position: relative; border: 2px dashed #e2e8f0; 
            border-radius: 12px; overflow: hidden; background: #f8fafc; 
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .logo-container.has-image { border: none !important; background: transparent !important; }

        #logo-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 100; }
        #logo-preview { max-width: 100%; max-height: 100%; object-fit: contain; display: none; position: relative; z-index: 10; }
        .logo-placeholder { position: absolute; color: #94a3b8; font-size: 9px; text-align: center; padding: 10px; z-index: 5; pointer-events: none; }

        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; font-size: 10px; }
            .invoice-card { box-shadow: none; border: 1px solid #eee; margin: 0; width: 100%; padding: 15px !important; }
        }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-4xl mx-auto mb-4 no-print flex justify-between items-center bg-white p-3 rounded-xl border shadow-sm">
        <div class="font-bold text-emerald-600 font-black italic"> 
            <a href="https://www.facebook.com/basharessam11" target="_blank"> © bashar essam❤️</a>
        </div>
        <div class="flex gap-2">
            <button onclick="resetInvoice()" class="bg-red-50 text-red-600 px-4 py-1.5 rounded-lg text-xs hover:bg-red-100 border border-red-200">فاتورة جديدة</button>
            <button onclick="window.print()" class="bg-slate-900 text-white px-5 py-1.5 rounded-lg text-xs hover:bg-slate-800 shadow-lg">طباعة</button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto invoice-card p-10 md:p-12">
        <div class="flex justify-between items-center mb-8 border-b pb-6">
            <div class="flex items-center gap-6">
                <div id="logo-box" class="logo-container">
                    <input type="file" id="logo-input" accept="image/*" onchange="previewLogo(this)">
                    <div id="logo-empty" class="logo-placeholder">اضغط هنا لرفع الشعار</div>
                    <img id="logo-preview" src="#" alt="شعار">
                </div>
                <h1 class="text-3xl font-black text-slate-100 tracking-tighter uppercase italic">Invoice</h1>
            </div>
            <div class="text-left">
                <div contenteditable="true" id="inv-id" oninput="saveAll()" class="editable font-bold text-sm">#INV-2026-001</div>
                <div contenteditable="true" id="inv-dt" oninput="saveAll()" class="editable text-[10px] text-slate-500 mt-1">25/01/2026</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-8 mb-8 bg-slate-50/50 p-5 rounded-xl border border-slate-100">
            <div>
                <h4 class="text-[8px] font-black text-emerald-600 uppercase mb-2 tracking-widest italic">المورد</h4>
                <div contenteditable="true" id="s-name" oninput="saveAll()" class="editable font-bold text-slate-800">اسم مؤسستك</div>
                <div class="flex items-center gap-1 text-[10px] text-slate-500 mt-1">
                    <span>الرقم الضريبي:</span>
                    <div contenteditable="true" id="s-tax" oninput="saveAll()" class="editable font-mono font-bold">300012345600003</div>
                </div>
            </div>
            <div class="border-r border-slate-200 pr-8">
                <h4 class="text-[8px] font-black text-blue-600 uppercase mb-2 tracking-widest text-left italic">العميل</h4>
                <div contenteditable="true" id="c-name" oninput="saveAll()" class="editable font-bold text-slate-800 text-left">اسم العميل</div>
                <div contenteditable="true" id="c-tax" oninput="saveAll()" class="editable text-[10px] text-slate-500 text-left mt-1">الرقم الضريبي للعميل</div>
            </div>
        </div>

        <table class="w-full text-right mb-4">
            <thead>
                <tr class="text-slate-400 text-[9px] uppercase border-b border-slate-100">
                    <th class="pb-3">الوصف</th>
                    <th class="pb-3 text-center w-20">الكمية</th>
                    <th class="pb-3 text-center w-24">السعر</th>
                    <th class="pb-3 text-left w-24">المبلغ</th>
                    <th class="pb-3 w-8 no-print"></th>
                </tr>
            </thead>
            <tbody id="items-list"></tbody>
        </table>
        
        <button onclick="addNewRow()" class="no-print text-emerald-600 font-bold text-[10px] hover:underline">+ إضافة بند</button>

        <div class="flex flex-col md:flex-row justify-between items-start gap-10 mt-10 border-t pt-8">
            <div id="qrcode" class="p-1.5 border bg-white rounded-lg shadow-sm"></div>
            
            <div class="w-full md:w-64 space-y-2 text-[11px]">
                <div class="flex justify-between text-slate-500"><span>المجموع الفرعي</span><span id="sub-total">0.00</span></div>
                <div class="flex justify-between text-slate-500 border-b pb-1"><span>الضريبة (15%)</span><span id="vat-total">0.00</span></div>
                
                <div class="flex justify-between items-center bg-red-50 p-2 rounded-lg border border-red-100 text-red-700">
                    <div class="flex items-center gap-1 font-bold text-[10px]">
                        <span>الخصم</span>
                        <select id="d-type" onchange="calculateAll()" class="text-[8px] border bg-white rounded no-print">
                            <option value="f">ريال</option>
                            <option value="p">%</option>
                        </select>
                    </div>
                    <input type="number" id="d-val" value="0" class="w-16 text-left font-bold bg-transparent outline-none" oninput="calculateAll()">
                </div>

                <div class="bg-slate-900 text-white p-3 rounded-xl flex justify-between items-center shadow-lg">
                    <span class="text-[9px] font-bold opacity-60 uppercase">الصافي للدفع</span>
                    <span class="text-lg font-black" id="net-total">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewLogo(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const box = document.getElementById('logo-box');
                    const preview = document.getElementById('logo-preview');
                    const empty = document.getElementById('logo-empty');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    empty.style.display = 'none';
                    box.classList.add('has-image');
                    localStorage.setItem('saved_logo_bashar', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        function addNewRow(desc = "", qty = 1, price = 0) {
            const row = document.createElement('tr');
            row.className = "border-b border-slate-50";
            row.innerHTML = `
                <td class="py-3"><div contenteditable="true" class="editable font-medium text-slate-700" oninput="calculateAll()">${desc || "بند جديد..."}</div></td>
                <td class="py-3 text-center"><input type="number" value="${qty}" class="qty editable text-center w-full font-bold" oninput="calculateAll()"></td>
                <td class="py-3 text-center"><input type="number" value="${price}" class="price editable text-center w-full font-bold text-emerald-600" oninput="calculateAll()"></td>
                <td class="py-3 text-left font-bold row-sum">0.00</td>
                <td class="py-3 no-print text-center"><button onclick="this.parentElement.parentElement.remove(); calculateAll();" class="text-slate-200 hover:text-red-400">✕</button></td>
            `;
            document.getElementById('items-list').appendChild(row);
            calculateAll();
        }

        function calculateAll() {
            let sub = 0;
            const tableItems = [];
            document.querySelectorAll('#items-list tr').forEach(row => {
                const d = row.cells[0].innerText;
                const q = parseFloat(row.querySelector('.qty').value) || 0;
                const p = parseFloat(row.querySelector('.price').value) || 0;
                const total = q * p;
                row.querySelector('.row-sum').innerText = total.toFixed(2);
                sub += total;
                tableItems.push({ d, q, p });
            });

            const vat = sub * 0.15;
            const totalWithVat = sub + vat;
            const dv = parseFloat(document.getElementById('d-val').value) || 0;
            const dt = document.getElementById('d-type').value;
            const da = (dt === 'p') ? (totalWithVat * (dv/100)) : dv;
            const net = Math.max(0, totalWithVat - da);

            document.getElementById('sub-total').innerText = sub.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('vat-total').innerText = vat.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('net-total').innerText = net.toLocaleString('en-US', {minimumFractionDigits:2});
            
            genQR(net, vat);
            saveAll(tableItems);
        }

        function saveAll(items = null) {
            const data = {
                id: document.getElementById('inv-id').innerText,
                dt: document.getElementById('inv-dt').innerText,
                sn: document.getElementById('s-name').innerText,
                st: document.getElementById('s-tax').innerText,
                cn: document.getElementById('c-name').innerText,
                ct: document.getElementById('c-tax').innerText,
                dv: document.getElementById('d-val').value,
                dtp: document.getElementById('d-type').value,
                items: items || Array.from(document.querySelectorAll('#items-list tr')).map(row => ({
                    d: row.cells[0].innerText, q: row.querySelector('.qty').value, p: row.querySelector('.price').value
                }))
            };
            localStorage.setItem('bashar_invoice_data', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('bashar_invoice_data');
            const logo = localStorage.getItem('saved_logo_bashar');
            if (logo) {
                const preview = document.getElementById('logo-preview');
                const empty = document.getElementById('logo-empty');
                const box = document.getElementById('logo-box');
                preview.src = logo; preview.style.display = 'block';
                empty.style.display = 'none'; box.classList.add('has-image');
            }
            if (saved) {
                const d = JSON.parse(saved);
                document.getElementById('inv-id').innerText = d.id;
                document.getElementById('inv-dt').innerText = d.dt;
                document.getElementById('s-name').innerText = d.sn;
                document.getElementById('s-tax').innerText = d.st;
                document.getElementById('c-name').innerText = d.cn;
                document.getElementById('c-tax').innerText = d.ct;
                document.getElementById('d-val').value = d.dv || 0;
                document.getElementById('d-type').value = d.dtp || "f";
                d.items.forEach(i => addNewRow(i.d, i.q, i.p));
            } else { addNewRow(); }
        }

        function resetInvoice() {
            if(confirm("مسح كل البيانات والبدء من جديد؟")) { 
                localStorage.removeItem('bashar_invoice_data'); 
                location.reload(); 
            }
        }

        function genQR(total, vat) {
            const s = document.getElementById('s-name').innerText;
            const t = document.getElementById('s-tax').innerText;
            const time = new Date().toISOString();
            function tlv(tag, val) {
                const v = new TextEncoder().encode(val);
                return new Uint8Array([tag, v.length, ...v]);
            }
            const data = new Uint8Array([...tlv(1, s), ...tlv(2, t), ...tlv(3, time), ...tlv(4, total.toFixed(2)), ...tlv(5, vat.toFixed(2))]);
            const b64 = btoa(String.fromCharCode(...data));
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: b64, width: 120, height: 120, correctLevel: QRCode.CorrectLevel.M });
        }

        window.onload = loadData;
    </script>
</body>
</html>
